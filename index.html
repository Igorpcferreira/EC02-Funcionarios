<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>EC02 - Funcionarios</title>
</head>
<body>
<h2>Cadastro de Funcionários</h2>

<form id="formFuncionario">
  <label>Nome:</label>
  <input type="text" id="nome" required><br><br>

  <label>Idade:</label>
  <input type="number" id="idade" required><br><br>

  <label>Cargo:</label>
  <input type="text" id="cargo" required><br><br>

  <label>Salário (R$):</label>
  <input type="number" id="salario" step="0.01" required><br><br>

  <button type="submit">Cadastrar</button>
</form>

<h3>Lista de Funcionários</h3>
<table border="1" id="tabelaFuncionarios">
  <thead>
  <tr>
    <th>Nome</th>
    <th>Idade</th>
    <th>Cargo</th>
    <th>Salário (R$)</th>
  </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="js/script.js"></script>
</body>
</html>
